name: Wake bots

# Render free services spin down when idle and cannot wake themselves, so an
# external ping is required. This wakes BirdBot + ModerationBot at 11:00 local
# (08:00 UTC); their in-process keepalive then keeps them up until 19:00 UTC,
# after which they sleep again to stay under the 750 free instance-hours/month.

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  wake:
    runs-on: ubuntu-latest
    steps:
      - name: Wake BirdBot
        run: |
          curl -sS --max-time 300 -o /dev/null \
            -w "BirdBot: HTTP %{http_code} in %{time_total}s\n" \
            https://birdbot-9jut.onrender.com/health || true

      - name: Wake ModerationBot
        run: |
          curl -sS --max-time 300 -o /dev/null \
            -w "ModerationBot: HTTP %{http_code} in %{time_total}s\n" \
            https://moderationbot-10e0.onrender.com/health || true
