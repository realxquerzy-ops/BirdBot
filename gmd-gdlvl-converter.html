<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GMD <-> GDLVL Converter</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 600px;
            width: 100%;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        h1 {
            color: #fff;
            text-align: center;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.6);
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .dropzone {
            border: 2px dashed rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.02);
            margin-bottom: 20px;
        }

        .dropzone:hover {
            border-color: #4a9eff;
            background: rgba(74, 158, 255, 0.1);
        }

        .dropzone.dragover {
            border-color: #4a9eff;
            background: rgba(74, 158, 255, 0.15);
            transform: scale(1.02);
        }

        .dropzone-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .dropzone-text {
            color: #fff;
            font-size: 16px;
            margin-bottom: 5px;
        }

        .dropzone-subtext {
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
        }

        #fileInput {
            display: none;
        }

        .file-info {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            display: none;
        }

        .file-info.active {
            display: block;
        }

        .file-name {
            color: #fff;
            font-weight: 600;
            margin-bottom: 5px;
            word-break: break-all;
        }

        .file-type {
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            display: none;
        }

        .button-group.active {
            display: flex;
        }

        .btn {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            background: linear-gradient(135deg, #4a9eff 0%, #2563eb 100%);
            color: #fff;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(74, 158, 255, 0.4);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn.secondary {
            background: rgba(255, 255, 255, 0.1);
        }

        .btn.secondary:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.2);
            box-shadow: none;
        }

        .status {
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            min-height: 20px;
        }

        .status.success {
            color: #4ade80;
        }

        .status.error {
            color: #f87171;
        }

        .footer {
            text-align: center;
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>GMD ↔ GDLVL Converter</h1>
        <p class="subtitle">Convert Geometry Dash level files between formats</p>

        <div class="dropzone" id="dropzone">
            <div class="dropzone-icon">📁</div>
            <div class="dropzone-text">Drop file here or click to browse</div>
            <div class="dropzone-subtext">Supports .gmd and .gdlvl files</div>
        </div>
        <input type="file" id="fileInput" accept=".gmd,.gdlvl">

        <div class="file-info" id="fileInfo">
            <div class="file-name" id="fileName"></div>
            <div class="file-type" id="fileType"></div>
        </div>

        <div class="button-group" id="buttonGroup">
            <button class="btn" id="toGdlvlBtn">Convert to .GDLVL</button>
            <button class="btn secondary" id="toGmdBtn">Convert to .GMD</button>
        </div>

        <div class="status" id="status"></div>

        <div class="footer">
            All conversion happens locally in your browser • No files uploaded
        </div>
    </div>

    <script>
        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const fileType = document.getElementById('fileType');
        const buttonGroup = document.getElementById('buttonGroup');
        const toGdlvlBtn = document.getElementById('toGdlvlBtn');
        const toGmdBtn = document.getElementById('toGmdBtn');
        const status = document.getElementById('status');

        let currentFile = null;
        let currentFormat = null;
        let currentContent = null;

        dropzone.addEventListener('click', () => fileInput.click());

        dropzone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropzone.classList.add('dragover');
        });

        dropzone.addEventListener('dragleave', () => {
            dropzone.classList.remove('dragover');
        });

        dropzone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropzone.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        function bytesToString(bytes) {
            let result = '';
            for (let i = 0; i < bytes.length; i++) {
                result += String.fromCharCode(bytes[i]);
            }
            return result;
        }

        async function handleFile(file) {
            currentFile = file;
            fileName.textContent = file.name;
            status.textContent = 'Reading file...';
            status.className = 'status';

            try {
                const arrayBuffer = await file.arrayBuffer();
                const bytes = new Uint8Array(arrayBuffer);
                
                // Try to read as UTF-8 first to detect XML
                let textSample = '';
                try {
                    textSample = new TextDecoder('utf-8').decode(bytes.slice(0, 50));
                } catch (e) {
                    textSample = bytesToString(bytes.slice(0, 50));
                }
                
                if (textSample.trim().startsWith('<?xml') || textSample.includes('<plist') || textSample.includes('<k>k4</k>')) {
                    // It's likely gmd (XML)
                    try {
                        currentContent = new TextDecoder('utf-8').decode(bytes);
                    } catch (e) {
                        currentContent = bytesToString(bytes);
                    }
                    currentFormat = 'gmd';
                    fileType.textContent = 'Detected: .GMD (XML)';
                    buttonGroup.classList.add('active');
                    toGdlvlBtn.style.display = 'block';
                    toGmdBtn.style.display = 'none';
                    status.textContent = 'Ready to convert to .GDLVL';
                    status.className = 'status';
                    fileInfo.classList.add('active');
                } else {
                    // Try to decode as gdlvl (base64url + gzip)
                    try {
                        const b64Text = bytesToString(bytes).replace(/\s+/g, '');
                        // Normalize base64url to standard base64
                        let b64 = b64Text.replace(/-/g, '+').replace(/_/g, '/');
                        while (b64.length % 4) {
                            b64 += '=';
                        }
                        
                        const binaryString = atob(b64);
                        const decodedBytes = new Uint8Array(binaryString.length);
                        for (let i = 0; i < binaryString.length; i++) {
                            decodedBytes[i] = binaryString.charCodeAt(i);
                        }
                        
                        const ungzipped = pako.ungzip(decodedBytes);
                        try {
                            currentContent = new TextDecoder('utf-8').decode(ungzipped);
                        } catch (e) {
                            currentContent = bytesToString(ungzipped);
                        }
                        
                        if (currentContent.includes('<?xml') || currentContent.includes('<plist') || currentContent.includes('<k>k4</k>')) {
                            currentFormat = 'gdlvl';
                            fileType.textContent = 'Detected: .GDLVL (base64+gzip)';
                            buttonGroup.classList.add('active');
                            toGdlvlBtn.style.display = 'none';
                            toGmdBtn.style.display = 'block';
                            status.textContent = 'Ready to convert to .GMD';
                            status.className = 'status';
                            fileInfo.classList.add('active');
                        } else {
                            throw new Error('Not a valid level file');
                        }
                    } catch (e) {
                        throw new Error('Could not detect file format - make sure it\'s a valid .gmd or .gdlvl file');
                    }
                }
            } catch (error) {
                status.textContent = 'Error: ' + error.message;
                status.className = 'status error';
                fileInfo.classList.remove('active');
                buttonGroup.classList.remove('active');
            }
        }

        function stringToArrayBuffer(str) {
            const bytes = new Uint8Array(str.length);
            for (let i = 0; i < str.length; i++) {
                bytes[i] = str.charCodeAt(i);
            }
            return bytes.buffer;
        }

        toGdlvlBtn.addEventListener('click', () => {
            if (currentFormat !== 'gmd') return;
            
            try {
                status.textContent = 'Converting...';
                status.className = 'status';
                
                const xml = currentContent;
                const xmlBytes = stringToArrayBuffer(xml);
                const compressed = pako.gzip(xmlBytes);
                
                // Convert to base64url
                let binary = '';
                for (let i = 0; i < compressed.length; i++) {
                    binary += String.fromCharCode(compressed[i]);
                }
                let base64 = btoa(binary);
                const base64url = base64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
                
                const blob = new Blob([base64url], { type: 'application/octet-stream' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = currentFile.name.replace(/\.gmd$/i, '.gdlvl');
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                
                status.textContent = 'Converted successfully! Download started.';
                status.className = 'status success';
            } catch (error) {
                status.textContent = 'Error: ' + error.message;
                status.className = 'status error';
            }
        });

        toGmdBtn.addEventListener('click', () => {
            if (currentFormat !== 'gdlvl') return;
            
            try {
                status.textContent = 'Converting...';
                status.className = 'status';
                
                const xml = currentContent;
                const blob = new Blob([xml], { type: 'text/xml' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = currentFile.name.replace(/\.gdlvl$/i, '.gmd');
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                
                status.textContent = 'Converted successfully! Download started.';
                status.className = 'status success';
            } catch (error) {
                status.textContent = 'Error: ' + error.message;
                status.className = 'status error';
            }
        });
    </script>
</body>
</html>
